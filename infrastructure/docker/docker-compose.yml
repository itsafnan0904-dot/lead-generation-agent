version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_sales_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default password: compose refuses to start until POSTGRES_PASSWORD is set in your .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong, unique value}
      POSTGRES_DB: ${POSTGRES_DB:-ai_sales_agent}
    ports:
      # Bound to this machine only, so the database is never reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_sales_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_sales_agent_redis
    restart: unless-stopped
    # Loopback only. Redis has no password here, so it must never be published on a network interface.
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ai_sales_agent_postgres_data
  redis_data:
    name: ai_sales_agent_redis_data
